<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校园电费监控</title>
<style>
  :root{
    --bg0:#0a0f1e; --bg1:#0e1830; --card:rgba(255,255,255,.045); --card-border:rgba(255,255,255,.09);
    --text:#e6edf7; --muted:#8b98ad; --faint:#5b6a80;
    --teal:#22d3ee; --green:#34d399; --amber:#fbbf24; --red:#f87171; --violet:#a78bfa;
    --pill-ok:rgba(52,211,153,.16); --pill-ok-fg:#34d399; --pill-ok-bd:rgba(52,211,153,.35);
    --pill-low:rgba(251,191,36,.14); --pill-low-fg:#fbbf24; --pill-low-bd:rgba(251,191,36,.35);
    --pill-bad:rgba(248,113,113,.15); --pill-bad-fg:#f87171; --pill-bad-bd:rgba(248,113,113,.4);
    --pill-unk:rgba(139,152,173,.15); --pill-unk-fg:#8b98ad; --pill-unk-bd:rgba(139,152,173,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family: ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 20%, rgba(167,139,250,.08), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #0a0f1e);
    color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:28px 18px 40px;
  }
  .wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:2px 4px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg, rgba(34,211,238,.25), rgba(167,139,250,.25));border:1px solid rgba(255,255,255,.12)}
  h1{font-size:19px;font-weight:650;letter-spacing:.3px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--faint)}
  .dot.on{background:var(--green);box-shadow:0 0 10px rgba(52,211,153,.9);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .card{background:var(--card);border:1px solid var(--card-border);border-radius:22px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 20px 60px rgba(0,0,0,.35);}
  .hero{padding:26px 28px;display:grid;grid-template-columns:1.25fr 1fr;gap:26px}
  @media (max-width:720px){ .hero{grid-template-columns:1fr;gap:18px;padding:22px} }
  .bal-label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .pill{padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid}
  .pill.ok{background:var(--pill-ok);color:var(--pill-ok-fg);border-color:var(--pill-ok-bd)}
  .pill.low{background:var(--pill-low);color:var(--pill-low-fg);border-color:var(--pill-low-bd)}
  .pill.bad{background:var(--pill-bad);color:var(--pill-bad-fg);border-color:var(--pill-bad-bd)}
  .pill.unk{background:var(--pill-unk);color:var(--pill-unk-fg);border-color:var(--pill-unk-bd)}
  .bal{display:flex;align-items:baseline;gap:10px;margin-top:10px}
  .bal .num{font-size:62px;font-weight:750;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#9fe8ff 70%,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bal .unit{font-size:16px;color:var(--muted)}
  .bal-sub{font-size:12.5px;color:var(--faint);margin-top:8px}

  .gauge{margin-top:18px}
  .gauge .track{position:relative;height:10px;border-radius:99px;overflow:hidden;
    background:linear-gradient(90deg, rgba(248,113,113,.5) 0 8%, rgba(251,191,36,.45) 8% 34%, rgba(52,211,153,.35) 34% 100%);
    border:1px solid rgba(255,255,255,.08)}
  .gauge .marker{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8);transition:left .6s cubic-bezier(.22,1,.36,1)}
  .gauge .legend{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--faint)}
  .gauge .legend b{color:var(--muted);font-weight:600}

  .stats{display:flex;flex-direction:column;gap:10px;justify-content:center}
  .stat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
  .stat .k{font-size:12.5px;color:var(--muted)}
  .stat .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11.5px;color:var(--faint);font-weight:400}

  .btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font-size:14px;font-weight:650;cursor:pointer;color:#06222b;
    background:linear-gradient(135deg,#67e8f9,#22d3ee 55%,#38bdf8);transition:transform .12s ease, box-shadow .2s ease, filter .2s;
    box-shadow:0 8px 24px rgba(34,211,238,.28);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:none}
  .btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#06222b;
    animation:rot .7s linear infinite;display:none}
  .btn.loading .spin{display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}

  .chart-card{padding:20px 22px 14px}
  .chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .chart-head h2{font-size:15px;font-weight:650}
  .chart-head .hint{font-size:12px;color:var(--faint)}
  .chart-box{position:relative;height:230px}
  canvas{width:100%;height:100%;display:block}
  .chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center;padding:0 30px;line-height:1.7}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid transparent;display:none;align-items:center;gap:6px}
  .chip.warn{display:inline-flex;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:#fbbf24}
  .chip.bad{display:inline-flex;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:#f87171}

  footer{text-align:center;font-size:12px;color:var(--faint);line-height:1.8;padding-top:4px}
  footer b{color:var(--muted);font-weight:600}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:rgba(20,30,48,.95);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 18px;
    font-size:13.5px;color:var(--text);transition:all .25s ease;z-index:50;max-width:min(88vw,560px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(248,113,113,.5)}
  .toast.ok{border-color:rgba(52,211,153,.45)}
  @media (max-width:720px){ .bal .num{font-size:52px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>校园电费监控</h1>
        <div class="sub" id="roomLabel">宿舍 · 正在加载…</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="clock"><span class="dot" id="liveDot"></span><span id="clock">--:--:--</span></div>
      <div class="clock" id="syncInfo" style="font-size:12px">页面每 30 秒自动同步</div>
    </div>
  </header>

  <section class="card hero">
    <div>
      <div class="bal-label">
        <span>剩余电量</span>
        <span class="pill unk" id="levelPill">未知</span>
      </div>
      <div class="bal">
        <span class="num" id="balanceNum">--</span>
        <span class="unit">度</span>
      </div>
      <div class="bal-sub" id="balanceSub">数据加载中…</div>
      <div class="gauge">
        <div class="track">
          <div class="marker" id="gaugeMarker" style="left:0%"></div>
        </div>
        <div class="legend">
          <span>告急 &lt; <b id="thCritical">5</b></span>
          <span>预警 &lt; <b id="thWarn">20</b></span>
          <span>充足 ≥ <b id="thWarn2">20</b></span>
        </div>
      </div>
      <div class="chips">
        <span class="chip warn" id="chipExpire">⏳ 会话可能已过期，请重新抓包更新 .env</span>
        <span class="chip bad" id="chipAuth">⚠️ 最近一次查询显示凭据失效</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">上次查询</span><span class="v" id="lastQuery">—</span></div>
      <div class="stat"><span class="k">今日消耗</span><span class="v" id="todayUsage">—</span></div>
      <div class="stat"><span class="k">预计可用</span><span class="v" id="estDays">—</span></div>
      <button class="btn" id="refreshBtn" type="button"><span class="spin"></span>立即刷新</button>
    </div>
  </section>

  <section class="card chart-card">
    <div class="chart-head">
      <h2>近 24 小时电量趋势</h2>
      <span class="hint">数据来自每 10 分钟的保活查询</span>
    </div>
    <div class="chart-box">
      <canvas id="chart"></canvas>
      <div class="chart-empty" id="chartEmpty">数据不足：保活任务每 10 分钟记录一次，攒够两个点后显示趋势</div>
    </div>
  </section>

  <footer>
    数据由 <b>keep_alive 保活任务</b> 自动刷新 · 点击「立即刷新」会实时查询网关（不触发推送）<br>
    state 文件：<b>state.json</b> · 服务：<b>web/server.py</b>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const REFRESH_POLL_MS = 30000;
const EXPIRE_HINT_MS = 32 * 60 * 1000; // 上次查询超过 32 分钟提示可能过期

let state = { loading: true };

function fmtNum(v, digits = 2) {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return "--";
  return Number(v).toFixed(digits);
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const now = new Date();
  const diff = (now - d) / 1000;
  const abs = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  if (diff >= 0 && diff < 60) return `刚刚 (${abs})`;
  if (diff >= 60 && diff < 3600) return `${Math.floor(diff / 60)} 分钟前 (${abs})`;
  if (diff >= 3600 && diff < 86400) return `${Math.floor(diff / 3600)} 小时前 (${abs})`;
  const md = `${d.getMonth() + 1}/${d.getDate()} ${abs}`;
  return md;
}
function toast(msg, type = "") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 4200);
}

function setLevel(level) {
  const pill = $("levelPill");
  const map = {
    ok: ["充足", "ok"],
    low: ["偏低", "low"],
    critical: ["告急", "bad"],
    unknown: ["未知", "unk"],
  };
  const [txt, cls] = map[level] || ["未知", "unk"];
  pill.textContent = txt;
  pill.className = "pill " + cls;
}

function todayUsage(history) {
  if (!Array.isArray(history) || history.length < 2) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pts = history
    .map((p) => ({ t: new Date(p.t), bal: Number(p.bal) }))
    .filter((p) => !Number.isNaN(p.t.getTime()) && !Number.isNaN(p.bal));
  const todays = pts.filter((p) => p.t >= today);
  if (todays.length < 2) return null;
  todays.sort((a, b) => a.t - b.t);
  const used = Math.max(0, todays[0].bal - todays[todays.length - 1].bal);
  return used;
}

function estDays(history, balance) {
  if (!Array.isArray(history) || history.length < 2 || !balance) return null;
  const pts = history
    .map((p) => ({ t: new Date(p.t), bal: Number(p.bal) }))
    .filter((p) => !Number.isNaN(p.t.getTime()) && !Number.isNaN(p.bal))
    .sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;
  const first = pts[0], last = pts[pts.length - 1];
  const hours = (last.t - first.t) / 3600000;
  if (hours < 0.5) return null;
  const drop = first.bal - last.bal;
  if (drop <= 0) return null;
  const ratePerDay = drop / (hours / 24);
  const days = balance / ratePerDay;
  if (!Number.isFinite(days)) return null;
  return days;
}

function render(d) {
  state = d;
  $("roomLabel").textContent = (d.room || "目标宿舍") + " · 电控电表预存";
  $("balanceNum").textContent = fmtNum(d.balance);
  setLevel(d.level || "unknown");

  const warn = Number(d.warn_threshold ?? 20);
  const crit = Number(d.critical_threshold ?? 5);
  $("thCritical").textContent = crit;
  $("thWarn").textContent = warn;
  $("thWarn2").textContent = warn;

  const barMax = Math.max(warn * 3, 60);
  const bal = Number(d.balance ?? 0);
  const pct = Math.max(0, Math.min(100, (bal / barMax) * 100));
  $("gaugeMarker").style.left = pct + "%";
  $("balanceSub").textContent = bal > barMax
    ? "远超预警线（安全区）"
    : `距预警线（${warn} 度）还有 ${fmtNum(Math.max(0, bal - warn))} 度`;

  $("lastQuery").textContent = fmtTime(d.last_query_time);
  const used = todayUsage(d.history);
  $("todayUsage").innerHTML = used === null
    ? "—"
    : `${fmtNum(used, 1)} <small>度</small>`;
  const days = estDays(d.history, bal);
  $("estDays").innerHTML = days === null
    ? "—"
    : `约 ${days < 1 ? "不足 1" : Math.round(days)} <small>天</small>`;

  // 过期提示
  const last = d.last_query_time ? new Date(d.last_query_time) : null;
  const expire = last && !Number.isNaN(last.getTime()) && (Date.now() - last.getTime() > EXPIRE_HINT_MS || d.level === "unknown");
  $("chipExpire").style.display = expire ? "inline-flex" : "none";
  const authRecent = d.last_auth_error_at && new Date(d.last_auth_error_at).getTime() > Date.now() - 3600000;
  $("chipAuth").style.display = authRecent ? "inline-flex" : "none";

  $("syncInfo").textContent = "上次同步 " + fmtTime(d.server_time || null);
  $("liveDot").className = "dot on";
  drawChart(d.history);
}

async function fetchStatus() {
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (err) {
    $("liveDot").className = "dot";
    toast("无法获取状态：" + err.message, "err");
  }
}

function drawChart(history) {
  const canvas = $("chart");
  const box = canvas.parentElement;
  const empty = $("chartEmpty");
  const dpr = window.devicePixelRatio || 1;
  const w = box.clientWidth, h = box.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const now = Date.now();
  const cutoff = now - 24 * 3600 * 1000;
  const pts = (Array.isArray(history) ? history : [])
    .map((p) => ({ t: new Date(p.t).getTime(), bal: Number(p.bal) }))
    .filter((p) => Number.isFinite(p.t) && Number.isFinite(p.bal) && p.t >= cutoff)
    .sort((a, b) => a.t - b.t);

  if (pts.length < 2) { empty.style.display = "grid"; return; }
  empty.style.display = "none";

  const padL = 44, padR = 16, padT = 14, padB = 26;
  const iw = w - padL - padR, ih = h - padT - padB;
  const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 3600000);
  const vMin = Math.min(...pts.map((p) => p.bal));
  const vMax = Math.max(...pts.map((p) => p.bal));
  const span = Math.max(vMax - vMin, 0.5);
  const vLo = vMin - span * 0.12, vHi = vMax + span * 0.12;
  const X = (t) => padL + ((t - t0) / (t1 - t0)) * iw;
  const Y = (v) => padT + ih - ((v - vLo) / (vHi - vLo)) * ih;

  // 网格
  ctx.strokeStyle = "rgba(255,255,255,.06)";
  ctx.lineWidth = 1;
  ctx.font = "11px ui-sans-serif, system-ui";
  ctx.fillStyle = "rgba(139,152,173,.85)";
  for (let i = 0; i <= 3; i++) {
    const y = padT + (ih / 3) * i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    const val = vHi - ((vHi - vLo) / 3) * i;
    ctx.fillText(val.toFixed(1), 4, y + 4);
  }

  // 面积渐变
  const grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
  grad.addColorStop(0, "rgba(34,211,238,.35)");
  grad.addColorStop(1, "rgba(34,211,238,.02)");
  ctx.beginPath();
  pts.forEach((p, i) => (i === 0 ? ctx.moveTo(X(p.t), Y(p.bal)) : ctx.lineTo(X(p.t), Y(p.bal))));
  ctx.lineTo(X(pts[pts.length - 1].t), padT + ih);
  ctx.lineTo(X(pts[0].t), padT + ih);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // 折线
  ctx.beginPath();
  pts.forEach((p, i) => (i === 0 ? ctx.moveTo(X(p.t), Y(p.bal)) : ctx.lineTo(X(p.t), Y(p.bal))));
  ctx.strokeStyle = "#22d3ee"; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke();

  // 末端点
  const lastP = pts[pts.length - 1];
  ctx.beginPath(); ctx.arc(X(lastP.t), Y(lastP.bal), 3.6, 0, Math.PI * 2);
  ctx.fillStyle = "#7dd3fc"; ctx.fill();
  ctx.strokeStyle = "rgba(125,211,252,.3)"; ctx.lineWidth = 6; ctx.stroke();

  // 时间轴
  const fmtT = (t) => { const d = new Date(t); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  ctx.fillStyle = "rgba(139,152,173,.85)";
  ctx.fillText(fmtT(t0), padL, h - 6);
  ctx.fillText(fmtT(t1), w - padR - 34, h - 6);
}

async function doRefresh() {
  const btn = $("refreshBtn");
  btn.disabled = true;
  btn.classList.add("loading");
  try {
    const res = await fetch("/api/query", { method: "POST", cache: "no-store" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = body.error || "unknown";
      const msg = body.message || ("HTTP " + res.status);
      if (err === "auth") toast("会话已失效：" + msg, "err");
      else toast("查询失败：" + msg, "err");
      return;
    }
    render(body);
    toast("刷新成功：剩余 " + fmtNum(body.balance) + " 度", "ok");
  } catch (err) {
    toast("请求失败：" + err.message, "err");
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
  }
}

function tickClock() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString("zh-CN", { hour12: false });
}

$("refreshBtn").addEventListener("click", doRefresh);
window.addEventListener("resize", () => { if (state.history) drawChart(state.history); });

tickClock(); setInterval(tickClock, 1000);
fetchStatus(); setInterval(fetchStatus, REFRESH_POLL_MS);
</script>
</body>
</html>
